name: Community

# Odpowiedzi na komentarze (scripts/community_cloud.py z prywatnego repo studia). Zgłoszenia akceptacji
# trafiają do prywatnego repo; publiczny log pokazuje tylko status.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: community
  cancel-in-progress: false

jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qberto1988/deephouse-studio
          ref: main
          token: ${{ secrets.STUDIO_REPO_TOKEN }}
          path: studio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cykl spolecznosci
        working-directory: studio
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          STUDIO_REPO: qberto1988/deephouse-studio
          STUDIO_REPO_TOKEN: ${{ secrets.STUDIO_REPO_TOKEN }}
          OWNER_LOGIN: ${{ github.repository_owner }}
        run: |
          pip install --quiet google-api-python-client google-auth requests > /dev/null 2>&1
          python scripts/community_cloud.py > /tmp/community.log 2>&1 || { echo "cykl nieudany"; exit 1; }
          echo "ok"
