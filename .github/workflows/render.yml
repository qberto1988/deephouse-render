name: Render

# Publiczne repozytorium wyłącznie do renderu (minuty GitHub Actions bez limitu dla repozytoriów publicznych).
# Kod studia, zlecenie (muzyka) i wyniki są w PRYWATNYM repozytorium qberto1988/deephouse-studio -
# pobierane tokenem z sekretu STUDIO_REPO_TOKEN; tu nie ma muzyki, kodu ani danych.
# Logi tego repozytorium są publiczne, dlatego szczegóły kroków trafiają tylko do run.log w prywatnym
# render-results, a tu widać jedynie nazwy kroków i status.
# Wyzwalacze tylko harmonogram i ręczny (bez pull_request) - obce osoby nie uruchomią zadania z sekretami.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # tylko plik keepalive w tym repozytorium (harmonogram nie wygasa po 60 dniach)

concurrency:
  group: render
  cancel-in-progress: false

env:
  STUDIO_REPO: qberto1988/deephouse-studio

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Kod studia (prywatne repozytorium)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STUDIO_REPO }}
          ref: main
          token: ${{ secrets.STUDIO_REPO_TOKEN }}
          path: studio
      - name: Nowe zlecenie?
        id: job
        working-directory: studio
        run: |
          mkdir -p /tmp/log
          git fetch -q --depth 1 origin render-job 2>/dev/null || { echo "brak zlecenia"; exit 0; }
          git show FETCH_HEAD:job.json > /tmp/job.json 2>/dev/null || { echo "brak zlecenia"; exit 0; }
          RUNNER=$(python3 -c "import json;print(json.load(open('/tmp/job.json')).get('runner',''))")
          NAME=$(python3 -c "import json;print(json.load(open('/tmp/job.json'))['name'])")
          [ "$RUNNER" = "public" ] || { echo "zlecenie nie dla tego repozytorium"; exit 0; }
          git fetch -q --depth 1 origin render-results 2>/dev/null || true
          if git cat-file -e FETCH_HEAD:results/$NAME/claimed.json 2>/dev/null; then echo "zlecenie juz podjete"; exit 0; fi
          # Rezerwacja przed renderem: utrata runnera nie spowoduje drugiego renderu tych samych utworów.
          git config user.name "Studio chmura"; git config user.email "studio@localhost"
          git worktree add -q /tmp/res FETCH_HEAD -B render-results
          mkdir -p /tmp/res/results/$NAME
          echo "{\"run\": \"$GITHUB_RUN_ID\", \"repo\": \"$GITHUB_REPOSITORY\"}" > /tmp/res/results/$NAME/claimed.json
          (cd /tmp/res && git add -A && git commit -qm "Podjete $NAME" && git push -q origin render-results) || { echo "rezerwacja nieudana"; exit 0; }
          git worktree remove --force /tmp/res
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
      - name: Przygotowanie
        if: steps.job.outputs.name != ''
        working-directory: studio
        run: |
          {
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
            git fetch -q --depth 1 origin render-job && git worktree add -q ../_job FETCH_HEAD
            cp -r ../_job/data/. data/ && cp ../_job/job.json job.json && git worktree remove --force ../_job
            for i in 1 2 3; do
              sudo apt-get -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && \
                sudo apt-get -qq -o Acquire::Retries=3 install -y ffmpeg >/dev/null && break
              sleep 20
            done
            if ! command -v ffmpeg >/dev/null; then
              curl -fsSL --retry 5 -o /tmp/ff.tar.xz \
                https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
              sudo tar -xJf /tmp/ff.tar.xz -C /opt && sudo ln -sf /opt/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin/* /usr/local/bin/
            fi
            ffmpeg -hide_banner -version | head -1
            df -h /
          } >> /tmp/log/run.log 2>&1
      - uses: astral-sh/setup-uv@v6
        if: steps.job.outputs.name != ''
      - name: Modele ML (cache)
        if: steps.job.outputs.name != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-v1
      - name: Zaleznosci i sekrety
        if: steps.job.outputs.name != ''
        working-directory: studio
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          HF_TOKEN_1: ${{ secrets.HF_TOKEN_1 }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          HF_TOKEN_3: ${{ secrets.HF_TOKEN_3 }}
        run: |
          uv sync --quiet >> /tmp/log/run.log 2>&1
          umask 077
          mkdir -p ~/.studio ~/.cache/huggingface
          printf '%s' "$YT_TOKEN_JSON" > ~/.studio/youtube_token.json
          printf '%s' "$YT_CLIENT_SECRET" > ~/.studio/client_secret.json
          printf '%s' "$HF_TOKEN_1" > ~/.cache/huggingface/token
          printf '%s' "$HF_TOKEN_2" > ~/.studio/hf_token_backup
          printf '%s' "$HF_TOKEN_3" > ~/.studio/hf_token_backup2
      - name: Scena dopasowana do muzyki
        if: steps.job.outputs.name != ''
        working-directory: studio
        run: |
          python3 -c "import json;json.dump(json.load(open('job.json'))['music'],open('/tmp/music.json','w'))"
          for i in 1 2; do
            uv run python scripts/make_scene.py --music /tmp/music.json >> /tmp/log/run.log 2>&1 || true
            S=$(python3 scripts/cloud_pick_scene.py 2>>/tmp/log/run.log) && break
          done
          test -n "$S" || { echo "brak sceny, ktora przeszla kontrole"; exit 1; }
          echo "SCENE=$S" >> $GITHUB_ENV
      - name: Render, miks, QA
        if: steps.job.outputs.name != ''
        working-directory: studio
        run: |
          TR=$(python3 -c "import json;print(' '.join(json.load(open('job.json'))['tracks']))")
          export STUDIO_SERIES_VOL=$(python3 -c "import json;print(json.load(open('job.json')).get('series_vol') or '')")
          uv run python scripts/build_episode.py --scene "$SCENE" --tracks $TR >> /tmp/log/run.log 2>&1
          EP=$(ls -td data/episodes/*/ | head -1)
          echo "EP=$EP" >> $GITHUB_ENV
          python3 -c "import json;m=json.load(open('${EP}manifest.json',encoding='utf-8'));print('QA:',m['qa_passed'])"
      - name: Wysylka PRYWATNA (gdy QA 100%)
        if: steps.job.outputs.name != ''
        working-directory: studio
        run: |
          OK=$(python3 -c "import json;m=json.load(open('${EP}manifest.json',encoding='utf-8'));print(int(bool(m['qa_passed'])))")
          if [ "$OK" = "1" ]; then
            uv run python scripts/upload_when_allowed.py "$EP" --every 10 --hours 3 >> /tmp/log/run.log 2>&1 || echo "wysylka nieudana - Mikrus odrzuci zlecenie, muzyka wraca do puli"
          fi
      - name: Odcinek radiowy 1080p -> Mikrus
        if: steps.job.outputs.name != '' && env.EP != ''
        working-directory: studio
        env:
          MIKRUS_RADIO_KEY: ${{ secrets.MIKRUS_RADIO_KEY }}
          RADIO_TARGET: ${{ secrets.MIKRUS_RADIO_TARGET }}  # użytkownik@host - adres serwera nie jest publiczny
          RADIO_PORT: ${{ secrets.MIKRUS_RADIO_PORT }}
        run: |
          OK=$(python3 -c "import json;m=json.load(open('${EP}manifest.json',encoding='utf-8'));print(int(bool(m['qa_passed'])))")
          if [ "$OK" != "1" ] || [ -z "$MIKRUS_RADIO_KEY" ] || [ -z "$RADIO_TARGET" ]; then echo "pomijam radio"; exit 0; fi
          {
            uv run python -c "import subprocess;from pathlib import Path;from studio import tools;from studio.publish import live;subprocess.run(live.segment_command(tools.ffmpeg(),Path('${EP}episode.mp4'),Path('/tmp/radio_$NAME.mp4')),check=True)"
            umask 077; echo "$MIKRUS_RADIO_KEY" > /tmp/rk
            rsync -e "ssh -i /tmp/rk -p ${RADIO_PORT:-22} -o StrictHostKeyChecking=accept-new -o BatchMode=yes" /tmp/radio_$NAME.mp4 "$RADIO_TARGET:radio_$NAME.mp4" || echo "przesylka radia nieudana"
            rm -f /tmp/rk
          } >> /tmp/log/run.log 2>&1
      - name: Wyniki do prywatnego render-results
        if: always() && steps.job.outputs.name != ''
        working-directory: studio
        run: |
          rm -f ~/.studio/*.json ~/.cache/huggingface/token ~/.studio/hf_token_backup*
          git config user.name "Studio chmura"; git config user.email "studio@localhost"
          for i in 1 2 3; do
            rm -rf /tmp/res; git worktree prune
            git fetch -q --depth 1 origin render-results && git worktree add -q /tmp/res FETCH_HEAD -B render-results
            mkdir -p /tmp/res/results/$NAME
            if [ -n "$EP" ]; then
              for f in manifest.json youtube.json review_sheet.jpg motion_preview.jpg thumbnail_1.jpg thumbnail_2.jpg thumbnail_3.jpg seo.json description.txt; do
                [ -f "$EP$f" ] && cp "$EP$f" /tmp/res/results/$NAME/
              done
            fi
            [ -n "$SCENE" ] && cp "$SCENE/scene.json" /tmp/res/results/$NAME/scene.json 2>/dev/null || true
            tail -c 400000 /tmp/log/run.log > /tmp/res/results/$NAME/run.log 2>/dev/null || true
            echo "{\"run\": \"${{ github.run_id }}\", \"repo\": \"${{ github.repository }}\", \"status\": \"${{ job.status }}\"}" > /tmp/res/results/$NAME/run.json
            (cd /tmp/res && git add -A && git commit -qm "Wynik $NAME" && git push -q origin render-results) && break
            sleep 10
          done
      - name: Keepalive harmonogramu
        if: always()
        uses: actions/checkout@v4
        with:
          path: self
      - name: Keepalive (raz w miesiacu)
        if: always()
        working-directory: self
        run: |
          LAST=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          if [ $(( $(date +%s) - LAST )) -gt 2592000 ]; then
            date -u +%F > keepalive.txt
            git config user.name "Studio chmura"; git config user.email "studio@localhost"
            git add keepalive.txt && git commit -qm "keepalive" && git push -q || true
          fi
